apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend-container
        image: ankitchaure1998/hotel_app_frontend_jenkins_3000:v5
        imagePullPolicy: Always

        ports:
        - containerPort: 3000
          protocol: TCP
